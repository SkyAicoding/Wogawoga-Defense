<!doctype html><html><head><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="game-canvas"></canvas>
<script type="module">
import { build } from '/src/render/stage3d.ts';
import { STAGES } from '/src/data/index.ts';
import { GameRenderer } from '/src/render/renderer.ts';
import { DioramaCamera } from '/src/render/camera.ts';
import { flagsFor } from '/src/render/quality.ts';

const out = { sweep: [] };
const W = 1280, H = 800;
const KINDS = ['spear','catapult','lightning','brazier','frost','poison','ballista','drum'];
const DT = 1/60;

try {
  const canvas = document.getElementById('game-canvas');
  canvas.width = W; canvas.height = H;
  const q = flagsFor('high');
  const renderer = new GameRenderer(canvas, q);
  const gl = renderer.gl.getContext();
  out.multiDraw = !!gl.getExtension('WEBGL_multi_draw');
  const cam = new DioramaCamera();
  const stage = STAGES[0];
  const s3 = build(stage, q);
  cam.fitToPlayfield(s3.aabb, { x: 0, y: 0, w: W, h: H - 200 }, W, H);
  for (let i = 0; i < 30; i++) cam.update(DT);

  // 건설 가능해 보이는 칸(레이아웃 '.')을 격자에서 골라 고정 목록을 만든다
  const cells = [];
  for (let z = 0; z < stage.gridH; z += 1) {
    const row = stage.layout[z] ?? '';
    for (let x = 0; x < stage.gridW; x += 1) if (row[x] === '.') cells.push({ x, z });
  }
  // 서로 떨어뜨려 겹치지 않게
  const spread = cells.filter((_, i) => i % 3 === 0);
  out.cellCount = cells.length;

  function frame(n) {
    for (let i = 0; i < n; i++) {
      s3.enemies.update([], 1, s3.cellToWorld, DT, []);
      s3.update(DT);
    }
    renderer.render(s3.scene, cam.camera);
    const r = renderer.gl.info.render;
    return { calls: r.calls, tris: r.triangles };
  }

  // --- 스윕: 같은종 / 전종섞기 ---
  for (const mode of ['same', 'mixed']) {
    const row = [];
    for (const n of [0, 4, 8, 12, 16, 20, 24, 40]) {
      const s = build(stage, q);
      for (let i = 0; i < n; i++) {
        const c = spread[i % spread.length];
        const defId = mode === 'same' ? 'spear' : KINDS[i % 8];
        const tier = mode === 'same' ? 0 : Math.floor(i / 8) % 5;
        s.towers.add(i, defId, tier, c.x, c.z);
      }
      for (let i = 0; i < 4; i++) { s.enemies.update([], 1, s.cellToWorld, DT, []); s.update(DT); }
      renderer.render(s.scene, cam.camera);
      const r = renderer.gl.info.render;
      row.push({ n, calls: r.calls, tris: r.triangles });
      s.dispose();
    }
    out.sweep.push({ mode, row });
  }

  // --- 스크린샷용 결정론 프레임: 8종 × 여러 티어 + 피격 + 발사 + 고스트 ---
  for (let i = 0; i < 16; i++) {
    const c = spread[i % spread.length];
    s3.towers.add(i, KINDS[i % 8], Math.floor(i / 8) % 5, c.x, c.z);
  }
  for (let i = 0; i < 8; i++) s3.towers.recoil(i);
  s3.towers.hit(3); s3.towers.hit(4); s3.towers.hit(11);
  s3.towers.setGhost('ballista', spread[20].x, spread[20].z, true);
  out.shot = frame(3);            // 플래시(0.07초) 가 살아 있는 프레임
  out.shotAfter = frame(30);      // 플래시가 끝난 뒤
  out.instances = { };
} catch (e) { out.error = String((e && e.stack) || e); }
window.__zz = out;
document.title = 'done';
</script></body></html>
