<!doctype html><html><head><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="game-canvas"></canvas>
<script type="module">
import * as THREE from 'three';
import { build } from '/src/render/stage3d.ts';
import { STAGES } from '/src/data/index.ts';
import { GameRenderer } from '/src/render/renderer.ts';
import { flagsFor } from '/src/render/quality.ts';

const out = {};
const W = 1280, H = 800, DT = 1/60;
const KINDS = ['spear','catapult','lightning','brazier','frost','poison','ballista','drum'];
try {
  const canvas = document.getElementById('game-canvas');
  canvas.width = W; canvas.height = H;
  const q = flagsFor('high');
  const renderer = new GameRenderer(canvas, q);
  const s3 = build(STAGES[0], q);
  // 두 줄 × 8종 (윗줄 T1, 아랫줄 T5)
  let id = 0;
  for (let k = 0; k < 8; k++) {
    s3.towers.add(id++, KINDS[k], 0, 3 + k, 6);
    s3.towers.add(id++, KINDS[k], 4, 3 + k, 9);
  }
  // 발사 연출 + 피격 플래시 + 고스트
  for (let i = 0; i < 16; i++) s3.towers.recoil(i);
  s3.towers.hit(4);   // lightning T1
  s3.towers.hit(13);  // ballista T5
  s3.towers.setGhost('catapult', 7, 12, true);
  s3.towers.aim(
    [{ id: 0, defId: 'spear', targetId: 99 }, { id: 12, defId: 'ballista', targetId: 99 },
     { id: 2, defId: 'catapult', targetId: 99 }, { id: 10, defId: 'poison', targetId: 99 }],
    [{ id: 99, alive: true, x: 8, z: 2, prevX: 8, prevZ: 2 }],
    1,
  );
  const cam = new THREE.PerspectiveCamera(32, W / H, 0.5, 200);
  const c = s3.cellToWorld(6.5, 7.5);
  cam.position.set(c.x - 1.5, 7.2, c.z + 9.5);
  cam.lookAt(c.x, 0.6, c.z);
  function frame(n) {
    for (let i = 0; i < n; i++) { s3.enemies.update([], 1, s3.cellToWorld, DT, []); s3.update(DT); }
    renderer.render(s3.scene, cam);
    const r = renderer.gl.info.render;
    return { calls: r.calls, tris: r.triangles };
  }
  out.f3 = frame(3);
  window.__shot2 = () => { out.f30 = frame(27); };
} catch (e) { out.error = String((e && e.stack) || e); }
window.__zz = out;
document.title = 'done';
</script></body></html>
