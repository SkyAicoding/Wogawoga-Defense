<!doctype html><html><body><canvas id="c" width="400" height="300"></canvas>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
const out = { steps: [] };
try {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.shadowMap.enabled = true;
  const gl = renderer.getContext();
  out.multiDraw = !!gl.getExtension('WEBGL_multi_draw');
  out.exts = gl.getSupportedExtensions().filter(e => /multi|draw/i.test(e));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x203040);
  const cam = new THREE.PerspectiveCamera(50, 4/3, 0.1, 100);
  cam.position.set(0, 4, 8); cam.lookAt(0, 0, 0);
  const sun = new THREE.DirectionalLight(0xffffff, 2.5);
  sun.position.set(4, 8, 3); sun.castShadow = true;
  scene.add(sun, new THREE.HemisphereLight(0x88aaff, 0x443322, 1.2));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshLambertMaterial({ color: 0x557744 }));
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
  function paint(g, c) {
    const n = g.getAttribute('position').count;
    const col = new Float32Array(n*3); const cc = new THREE.Color(c);
    for (let i=0;i<n;i++) { col[i*3]=cc.r; col[i*3+1]=cc.g; col[i*3+2]=cc.b; }
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    g.deleteAttribute('uv');
    return g;
  }
  const g1 = paint(new THREE.BoxGeometry(1,2,1).toNonIndexed(), 0xff8844);
  const g2 = paint(new THREE.ConeGeometry(0.8,2,6).toNonIndexed(), 0x44ddff);
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  const batch = new THREE.BatchedMesh(64, 4000, 0, mat);
  batch.castShadow = true;
  const id1 = batch.addGeometry(g1), id2 = batch.addGeometry(g2);
  out.geoIds = [id1, id2];
  const m = new THREE.Matrix4();
  for (let i=0;i<6;i++) {
    const inst = batch.addInstance(i%2 ? id2 : id1);
    m.makeTranslation(-4 + i*1.6, 1, 0);
    batch.setMatrixAt(inst, m);
  }
  scene.add(batch);
  renderer.render(scene, cam);
  out.calls = renderer.info.render.calls;
  out.tris = renderer.info.render.triangles;
  // 픽셀 확인
  const px = new Uint8Array(4*400*300);
  gl.readPixels(0,0,400,300,gl.RGBA,gl.UNSIGNED_BYTE,px);
  let orange=0, cyan=0;
  for (let i=0;i<px.length;i+=4) { if (px[i]>120 && px[i+2]<90) orange++; if (px[i+2]>140 && px[i]<110) cyan++; }
  out.orange = orange; out.cyan = cyan;
  // 인스턴스 숨기기
  batch.setVisibleAt(0, false);
  renderer.render(scene, cam);
  out.callsHidden = renderer.info.render.calls;
  out.trisHidden = renderer.info.render.triangles;
} catch (e) { out.error = String(e && e.stack || e); }
window.__zz = out;
document.title = 'done';
</script></body></html>
