# CI — **배포 브랜치와 PR 에서만 돈다.**
#
# ⚠ 왜 `branches-ignore: []`(모든 브랜치)에서 물러섰나 — 사용자 지적:
#     "git 에서 계속해서 오류 확인 메일이 와, 무시해도 되? 아님 이것도 수정 할 수 있어?"
#   이 저장소는 컨테이너가 작업 트리를 자주 잃어서 `claude/*-wip` 브랜치로 **롤백 보험
#   스냅샷**을 자주 민다(CLAUDE.md 「여러 기기에서 이어 하기」). 그 스냅샷은 정의상
#   미검증이라 CI 가 빨갛고, 그때마다 실패 메일이 하나씩 나갔다. 곧 메일의 대부분은
#   **신호가 아니라 스냅샷 소음**이었고, 그 소음이 진짜 빨강(배포 브랜치)을 덮었다.
#   보험 푸시가 검증 신호를 흉내 내면 안 된다 — 검증은 배포 브랜치와 PR 에서 한다.
#   WIP 브랜치를 그래도 한 번 돌려 보고 싶으면 Actions 탭에서 수동 실행(workflow_dispatch).
#
# ⚠ `check` 가 `npm test` 가 아니라 `npm run test:fast` 인 이유는 envelope.yml 머리말에 있다.
name: CI

on:
  push:
    branches:
      - claude/primitive-defense-game-7covq4
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:fast
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: test-results/
          retention-days: 7
